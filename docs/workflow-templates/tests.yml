name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Check editor bridge
        run: node tests/editor_smoke.cjs
      - name: Check Python source
        run: ruff check app
