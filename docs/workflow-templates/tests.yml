name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install pytest ruamel.yaml==0.19.1 "jsonschema>=4.26,<5" ruff
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Check Python source
        run: ruff check app
