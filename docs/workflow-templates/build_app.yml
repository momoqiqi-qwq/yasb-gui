name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install ".[dev,build]"
      - name: Test source
        run: python -m pytest -q
      - name: Build executable
        run: python app/scripts/build.py build
      - name: Package executable and dependencies
        shell: pwsh
        run: |
          $releaseVersion = python -c "import sys; sys.path.insert(0, 'app'); from core.constants import APP_VERSION; print(APP_VERSION)"
          python app/scripts/package_release.py $releaseVersion
      - name: Upload versioned packages
        uses: actions/upload-artifact@v7
        with:
          name: YASB-GUI-Windows-x64
          path: release-files/*/*
          if-no-files-found: error
